name: Build Android APK & Telegram Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App Package / Identifier'
        required: false
        default: 'civer-app-store'
        type: string
      app_name:
        description: 'Human Readable App Name'
        required: false
        default: 'Civer App Store'
        type: string
      repo_url:
        description: 'External Git Repo URL (leave empty to build native app/)'
        required: false
        default: ''
        type: string
      branch:
        description: 'Git Branch to checkout'
        required: false
        default: 'main'
        type: string
      gradle_task:
        description: 'Gradle Build Task'
        required: false
        default: 'assembleDebug'
        type: string
      telegram_chat_id:
        description: 'Telegram Chat ID to receive the compiled APK'
        required: false
        default: '7541607519'
        type: string
      telegram_bot_token:
        description: 'Telegram Bot Token (optional override)'
        required: false
        default: '8757193329:AAHOJtoR4E37xvl2_RP80STqutAqtbATqY4'
        type: string
      build_type:
        description: 'Build Variant (release or debug)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-and-deliver:
    name: Compile Android APK & Send via Telegram
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ inputs.app_id || 'civer-app-store' }}
      APP_NAME: ${{ inputs.app_name || 'Civer App Store' }}
      REPO_URL: ${{ inputs.repo_url || '' }}
      BRANCH: ${{ inputs.branch || 'main' }}
      GRADLE_TASK: ${{ inputs.gradle_task || 'assembleDebug' }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || '7541607519' }}
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || '8757193329:AAHOJtoR4E37xvl2_RP80STqutAqtbATqY4' }}

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Target Codebase
        id: resolve_code
        run: |
          if [ -n "$REPO_URL" ]; then
            echo "Cloning external repository: $REPO_URL"
            rm -rf external_workspace
            git clone --depth 1 --branch "$BRANCH" "$REPO_URL" external_workspace
            echo "WORK_DIR=external_workspace" >> $GITHUB_ENV
          else
            echo "Building native project in repository root"
            echo "WORK_DIR=." >> $GITHUB_ENV
          fi

      - name: Grant Execute Permissions to Gradlew
        run: |
          cd "$WORK_DIR"
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew || true

      - name: Compile APK with Gradle
        run: |
          cd "$WORK_DIR"
          echo "Executing Gradle task: $GRADLE_TASK"
          if [ -f "./gradlew" ]; then
            ./gradlew $GRADLE_TASK --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
          else
            gradle $GRADLE_TASK --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
          fi

      - name: Locate and Sign Generated APK
        id: locate_apk
        run: |
          cd "$WORK_DIR"
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file generated by Gradle build."
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          FILE_SIZE_BYTES=$(stat -c%s "$APK_FILE")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE_BYTES / 1048576}")
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE_MB=$FILE_SIZE_MB" >> $GITHUB_ENV
          echo "APK_SIZE_BYTES=$FILE_SIZE_BYTES" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-apk
          path: ${{ env.WORK_DIR }}/${{ env.APK_PATH }}
          retention-days: 30

      - name: Dispatch APK to Telegram
        if: env.TELEGRAM_CHAT_ID != ''
        run: |
          BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
          CHAT_ID="$TELEGRAM_CHAT_ID"
          FULL_APK_PATH="${WORK_DIR}/${APK_PATH}"
          echo "Dispatching to Telegram Chat ID: $CHAT_ID"
          CAPTION="Compilacion Exitosa de ${APP_NAME} (${APP_ID}) - Tamano: ${APK_SIZE_MB} MB - SHA256: ${APK_SHA256}"
          if [ "$APK_SIZE_BYTES" -le 52428800 ]; then
            curl -s -F chat_id="$CHAT_ID" -F document=@"$FULL_APK_PATH" -F caption="$CAPTION" "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d chat_id="$CHAT_ID" -d text="APK ${APP_NAME} (${APK_SIZE_MB} MB) disponible en: $RUN_URL"
          fi
