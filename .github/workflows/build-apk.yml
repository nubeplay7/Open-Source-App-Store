name: Build Android APK & Telegram Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App Package / Identifier'
        required: false
        default: 'civer-app-store'
        type: string
      app_name:
        description: 'Human Readable App Name'
        required: false
        default: 'Civer App Store'
        type: string
      repo_url:
        description: 'External Git Repo URL (leave empty to build native app/)'
        required: false
        default: ''
        type: string
      branch:
        description: 'Git Branch to checkout'
        required: false
        default: 'main'
        type: string
      gradle_task:
        description: 'Gradle Build Task'
        required: false
        default: 'assembleRelease'
        type: string
      telegram_chat_id:
        description: 'Telegram Chat ID to receive the compiled APK'
        required: false
        default: ''
        type: string
      telegram_bot_token:
        description: 'Telegram Bot Token (optional override)'
        required: false
        default: '8757193329:AAHOJtoR4E37xvl2_RP80STqutAqtbATqY4'
        type: string
      build_type:
        description: 'Build Variant (release or debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-and-deliver:
    name: 🚀 Compile Android APK & Send via Telegram
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Base Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Set up Android SDK & Build-Tools
        uses: android-actions/setup-android@v3

      - name: 📂 Resolve Target Codebase
        id: resolve_code
        run: |
          if [ -n "${{ inputs.repo_url }}" ]; then
            echo "Cloning external repository: ${{ inputs.repo_url }}"
            rm -rf external_workspace
            git clone --depth 1 --branch ${{ inputs.branch }} ${{ inputs.repo_url }} external_workspace
            cd external_workspace
            echo "WORK_DIR=external_workspace" >> $GITHUB_ENV
          else
            echo "Building native project in repository root"
            echo "WORK_DIR=." >> $GITHUB_ENV
          fi

      - name: 🔑 Grant Execute Permissions to Gradlew
        run: |
          cd ${{ env.WORK_DIR }}
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: ⚡ Compile APK with Gradle
        run: |
          cd ${{ env.WORK_DIR }}
          TASK="${{ inputs.gradle_task }}"
          if [[ "$TASK" != ./* ]]; then
            TASK="./gradlew $TASK"
          fi
          echo "Executing: $TASK"
          $TASK --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"

      - name: 🔍 Locate and Sign Generated APK
        id: locate_apk
        run: |
          cd ${{ env.WORK_DIR }}
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERROR: No APK file generated by Gradle build."
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          
          # Generate SHA-256 Checksum
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          FILE_SIZE_BYTES=$(stat -c%s "$APK_FILE")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE_BYTES / 1048576}")
          
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE_MB=$FILE_SIZE_MB" >> $GITHUB_ENV
          echo "APK_SIZE_BYTES=$FILE_SIZE_BYTES" >> $GITHUB_ENV

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-apk
          path: ${{ env.WORK_DIR }}/${{ env.APK_PATH }}
          retention-days: 30

      - name: 📲 Dispatch APK to Telegram (@EnviodeApkCompiladaBot)
        if: ${{ inputs.telegram_chat_id != '' }}
        run: |
          BOT_TOKEN="${{ inputs.telegram_bot_token }}"
          CHAT_ID="${{ inputs.telegram_chat_id }}"
          FULL_APK_PATH="${{ env.WORK_DIR }}/${{ env.APK_PATH }}"
          
          echo "Dispatching to Telegram Chat ID: $CHAT_ID"
          
          CAPTION="🎉 *¡Compilación Exitosa de ${{ inputs.app_name }}!*

📱 *App:* \`${{ inputs.app_name }}\` (\`${{ inputs.app_id }}\`)
📦 *Tamaño:* \`${{ env.APK_SIZE_MB }} MB\`
🛡️ *Firma OTA / SHA-256:* \`${{ env.APK_SHA256 }}\`
⚡ *Runner:* GitHub Cloud Runner (Ubuntu)
🔗 *Civer App Store Matrix*

_Descarga el archivo e instálalo directamente en tu dispositivo Android._"

          # Check if file size is <= 50MB (Telegram Bot API limit)
          if [ ${{ env.APK_SIZE_BYTES }} -le 52428800 ]; then
            echo "Sending APK document directly via Telegram Bot API..."
            RESPONSE=$(curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$FULL_APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
            echo "Telegram Response: $RESPONSE"
          else
            echo "APK exceeds 50MB. Sending notification with GitHub Actions artifact link..."
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d parse_mode="Markdown" \
              -d text="🎉 *¡Compilación Exitosa de ${{ inputs.app_name }}!*

El archivo APK pesa \`${{ env.APK_SIZE_MB }} MB\` (supera los 50MB de Telegram).
📥 Descárgalo directamente desde los artefactos de GitHub Actions:
$RUN_URL"
          fi
