    <script>
      // Guardia de Dominio Soberano: Prevenir que el Service Worker se active en dominios ajenos
      (function() {
        const h = window.location.hostname;
        const isLegit = h === 'appstore.civer.cloud' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local');
        if (!isLegit) {
          console.warn('[Civer Security] Dominio no autorizado para Civer App Store PWA:', h);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let r of regs) r.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (let k of keys) caches.delete(k);
            });
          }
        }
      })();
    </script>
