<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4" />

  <!-- Outer Hexagonal Tech Badge -->
  <path d="M 256 64 L 430 164 L 430 364 L 256 464 L 82 364 L 82 164 Z" 
        fill="#090d16" 
        stroke="url(#primaryGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Cyber Grid lines -->
  <path d="M 120 200 L 392 200 M 120 312 L 392 312 M 256 80 L 256 448" 
        stroke="#1e293b" 
        stroke-width="4" 
        stroke-dasharray="6,6" />

  <!-- Central Dynamic Lightning FOSS Android Bolt -->
  <path d="M 276 112 L 160 272 L 246 272 L 236 400 L 352 240 L 266 240 Z" 
        fill="url(#accentGrad)" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Circuit nodes -->
  <circle cx="256" cy="64" r="8" fill="#10b981" />
  <circle cx="430" cy="164" r="8" fill="#06b6d4" />
  <circle cx="430" cy="364" r="8" fill="#3b82f6" />
  <circle cx="256" cy="464" r="8" fill="#10b981" />
  <circle cx="82" cy="364" r="8" fill="#3b82f6" />
  <circle cx="82" cy="164" r="8" fill="#06b6d4" />

  <!-- Android Antennas on Top -->
  <line x1="210" y1="120" x2="185" y2="85" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="302" y1="120" x2="327" y2="85" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <circle cx="185" cy="85" r="5" fill="#34d399" />
  <circle cx="327" cy="85" r="5" fill="#34d399" />
</svg>
